<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <!-- Custom CSS -->
        <link rel="stylesheet" type="text/css" href="css/main.css" />
        <script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
            integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <div class="generalContainer">
            <div class="yourAccountUpgradedGeneral">
                <div class="upgradedNotifArea">
                    <div class="upgradeTopArea">CONGRATULATIONS!</div>
                    <div class="upgradeNotifMiddle">Your account has been upgraded to PREMIUM</div>
                </div>
            </div>

            <div class="collectedSection">
                <div class="collectedPrizeArea">
                    <div class="collectedPrizeTop">
                        COLLECTED
                        <span> PRIZE </span>
                    </div>

                    <div class="collectedItemImageArea">
                        <img src="./images/moneyBag.png" alt="" id="collectedImage" />
                    </div>

                    <div class="collectedPrizeCount" id="collectedPrzCount">$10000</div>
                </div>
            </div>

            <div class="prestigeButtonContainer" style="display: none;">
                <button id="prestigeButton" class="prestigeButton">Prestige</button>
            </div>

            <div class="redeemCodeGeneral">
                <div class="redeemCodeSection">
                    <div class="premiumCodeText">
                        <div id="premiumCodeTitle1">ENTER YOUR</div>
                        <span id="premiumCodeTitle2">PREMIUM</span>
                        <div class="premiumCodeTitle3">CODE:</div>
                    </div>
                    <div class="redeemCodeInputArea">
                        <input
                            id="inputForCode"
                            type="text"
                            class="redeemCodeInput"
                            value="ENTER THE CODE..."
                            onblur="if(this.value == '') { this.value='ENTER THE CODE...'}"
                            onfocus="if (this.value == 'ENTER THE CODE...') {this.value=''}"
                        />

                        <div class="acceptButtonRedeemCode">ACCEPT</div>
                    </div>
                    <div class="inputInfoArea">
                        <span class="material-icons" id="infoIconRedeem"> info </span>
                        <div class="redeemInfoText">You can activate it by entering your premium code at the top.</div>
                    </div>
                </div>
            </div>
            <div class="topSection">
                <div class="topText">
                    <div id="title-1">Ak4y</div>
                    <span id="title-2"> battle pass </span>
                </div>
                <!-- <div class="rectangleTop"></div> -->
                <!-- <div class="prestigeDisplay">Prestige: <span id="currentPrestige">0</span></div> -->
            </div>
<!-- 
            <div class="leftImageSection">
                <img src="./images/leftImage.png" alt="" />
            </div> -->

            <div class="middleAndRightArea">
                <!-- <div class="profilInfos" id="profilAreaTYPE">
                    <div class="infoImgArea">
                        <img class="profilePhotoAK4Y" src="./images/pokemon.jpg" alt="" />
                    </div> -->
                    <!-- <div class="playerNameArea">
                        <div id="playerName">ak4y</div>
                        <div id="playerSurName"></div>
                    </div> -->

                    <!-- <div class="accountTypeArea">
                        <div class="textAccountType">Account Type :</div>
                        <div class="accountTypeReal" id="accTypeID">STANDART</div>
                    </div> -->
                <!-- </div> -->

                <!-- <div class="premiumTaskArea">
                    <div class="premiumAreaText">
                        <span id="premiumTasksText1">Stable </span>
                        <div id="premiumTasksText2">missions</div>
                    </div>
                    <div class="premiumTasks"></div>
                </div> -->

                <div class="levelTextSection">
                    <div class="levelText">Level :</div>
                    <div class="myLevel" id="myCurrentLevel">3</div>
                    <span>/</span>
                    <div class="maxLevel">50</div>
                </div>
                <div class="levelExperienceSection">
                    <div class="currentXPText">150</div>
                    <span>/</span>
                    <div class="neededXP">1000 XP</div>
                </div>
                <div class="levelRect">
                    <div class="levelRectFill" id="levelFill"></div>
                </div>

                <!-- <div class="premiumTextxx">PREMIUM</div>
                <div class="standartTextxx">STANDART</div> -->

                <div class="battlePassNotPremiumItemBlur" id="scollBlur">
                    <div class="buyPremiumButton">PREMIUM BUY</div>
                </div>

                <div class="currentLevelContainer">
                    <img src="images/prestige1.png" alt="Prestige 1" id="prestigeImage" class="hidden">
                    <div class="currentLevel" id="myCurrentLevel2">3</div>
                </div>

                <div class="battlePassItemsArea">
                    <div class="BPItemArea" id="scollItemList"></div>
                </div>
            </div>

            <div class="bottomBpTaskSection">
                <div class="bottomTaskTextArea">
                    <div class="bottomTaskText">DAILY</div>
                    <div class="bottomTextRectangle"></div>
                    <div class="resetDailyTaskText"></div>
                </div>
                <div class="bottomTaskItemList"></div>
            </div>
        </div>

        <script src="js/fontawesome.min.js"></script>
        <script src="js/jquery-3.6.0.min.js"></script>
        <script src="js/jquery-ui.min.js"></script>
